name: smart_screenshot_manager
description: Offline Windows screenshot manager with local OCR and SQLite search.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hotkey_manager: ^0.2.3
  image: ^4.12.0
  intl: ^0.20.3
  open_file: ^4.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  platform_ocr: ^1.0.0
  sqflite_common_ffi: ^2.3.7+1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
